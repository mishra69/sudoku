# Per-app settings for deploy.sh. See the header of that file for all options.
WORKER_DIR=worker
STAMP_FILES="frontend/js/config.js frontend/sw.js"
# Browser-side halves of npm packages, copied from node_modules into the
# assets dir. Format: <src>:<dest>, space separated.
VENDOR_COPY="worker/node_modules/webpush-edge/src/client.js:frontend/js/vendor/webpush-edge/client.js worker/node_modules/webpush-edge/src/sw.js:frontend/js/vendor/webpush-edge/sw.js"

VERIFY_URL=https://sudoku.mishabhi.workers.dev
VERIFY_PATH=/js/config.js

# Commit the version stamp and push after each successful deploy.
GIT_COMMIT=1
